services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: serambi-emosi-backend
    environment:
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:4173,http://127.0.0.1:4173
      MAX_AUDIO_UPLOAD_BYTES: 10485760
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: serambi-emosi-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
