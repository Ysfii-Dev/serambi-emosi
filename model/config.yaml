project:
  base_dir: "."
  random_seed: 42

paths:
  data_dir: "data"
  outputs_dir: "outputs"
  models_dir: "models"
  features_dir: "features"
  processed_data_dir: "processed_data"
  metadata_csv: "metadata.csv"
  split_info_json: "split_info.json"

preprocessing:
  target_sr: 16000
  noise_freq_range: [300, 3400]
  apply_noise_reduction: false
  trim_silence: false
  split_strategy: "gender_balanced"
  actor_split:
    train: 28
    validation: 6
    test: 6

features:
  n_mfcc: 40
  n_fft: 2048
  hop_length: 512
  n_mels: 128
  fmax: 8000
  include_delta: true
  include_delta2: true
  extra_features: []
  min_max_frames: 100
  max_frames_source: "train_val"
  frame_percentile: 95
  frame_margin: 0
  emotion_codes: ["01", "02", "03", "04", "05"]

augmentation:
  p_aug: 0.7
  p_pitch: 0.3
  p_stretch: 0.3
  p_noise: 0.3
  p_gain: 0.3
  pitch_range: [-2.0, 2.0]
  stretch_range: [0.95, 1.05]
  snr_range: [15.0, 35.0]
  gain_range: [-3.0, 3.0]
  max_transforms: 2
  avoid_stretch_gain_combo: true
  confusion_focus_codes: ["04", "05"]
  confusion_focus_scale: 1
  feature_mask_prob: 0.0
  num_time_masks: 2
  time_mask_max_ratio: 0.0
  num_feature_masks: 2
  feature_mask_max_bins: 0

training:
  batch_size: 32
  epochs: 150
  learning_rate: 0.0004
  checkpoint_monitor: "val_macro_f1"
  checkpoint_mode: "max"
  early_stopping_patience: 15
  reduce_lr_patience: 5
  reduce_lr_factor: 0.5
  min_lr: 0.000001
  label_smoothing: 0.08

experiments:
  seeds: [13, 42, 77]
  run_variants:
    - name: "with_noisereduce"
      apply_noise_reduction: true
    - name: "without_noisereduce"
      apply_noise_reduction: false

model:
  num_classes: 5
  temporal_pooling: "attention"
  attention_units: 64
  spatial_dropout: 0.3
  lstm_units_1: 128
  lstm_units_2: 96
  dense_units_1: 128
  dense_units_2: 96
  dropout_1: 0.4
  dropout_2: 0.4
  lstm_dropout: 0.3
  recurrent_dropout: 0.2
  l2: 0.0001
